<script>(function (root) {
  'use strict';
  const ceil = n => Math.ceil(n - 1e-9);
  const round = n => Math.round(n * 100) / 100;
  function syncOrders(events, state = {}) {
    let created = 0, updated = 0, ignored = 0;
    for (const e of events) {
      const key = [e.channel, e.store_id, e.order_id, e.line_id].join('|');
      const old = state[key];
      if (!old) { state[key] = {...e}; created++; }
      else if (e.revision > old.revision) { state[key] = {...e}; updated++; }
      else { ignored++; }
    }
    return {state, created, updated, ignored, total: Object.keys(state).length};
  }
  function replenishment(product, stock, inbound, asOf) {
    const out = {sku: product.sku, warehouse: product.warehouse, product_name: product.name,
      daily_demand: null, lead_days: null, safety_days: product.safety_days,
      review_days: product.review_days, available: null, confirmed_inbound: null,
      target_stock: null, inventory_position: null, raw_quantity: null, order_quantity: null,
      first_gap_day: null, coverage_days: null, late_inbound: false,
      decision: '人工检查', reason: '', formula_version: 'DEMO-v1', recommendation_only: true};
    if (!stock) {out.reason='缺少库存记录'; return out;}
    const age = (new Date(asOf)-new Date(stock.updated_at))/60000;
    if (!Number.isFinite(age) || age < 0 || age > 60) {out.reason='库存数据超过60分钟或时间异常'; return out;}
    const checks = [stock.on_hand, stock.reserved, product.sold7, product.sold30,
      product.purchase_days, product.transit_days, product.receiving_days,
      product.safety_days, product.review_days, product.moq, product.carton];
    if (checks.some(n => !Number.isFinite(n) || n < 0) || product.carton < 1 ||
        !Number.isInteger(product.carton) || !Number.isInteger(product.moq) || stock.reserved > stock.on_hand) {
      out.reason='库存、需求或采购参数不合法'; return out;
    }
    if (product.new_product) {out.reason='新品缺少稳定销量，请人工制定首批数量'; return out;}
    const daily = Math.max(product.sold7/7, product.sold30/30);
    if (daily <= 0) {out.reason='没有可用需求历史，不能推断无需补货'; return out;}
    const lead = product.purchase_days + product.transit_days + product.receiving_days;
    if (!Number.isInteger(lead) || lead < 1) {out.reason='总提前期必须是正整数天'; return out;}
    const arrivals = inbound.filter(x => x.sku===product.sku && x.warehouse===product.warehouse && x.status==='confirmed');
    if (arrivals.some(x => !Number.isInteger(x.days_until_arrival) || x.days_until_arrival < 1 ||
        !Number.isFinite(x.quantity) || x.quantity <= 0)) {
      out.reason='在途到货日期或数量不明确，请采购核对'; return out;
    }
    const available = stock.on_hand-stock.reserved;
    const confirmed = arrivals.reduce((s,x)=>s+x.quantity,0);
    const target = ceil(daily*(lead+product.safety_days+product.review_days));
    const position = available+confirmed;
    const raw = Math.max(0, target-position);
    const quantity = raw > 0 ? ceil(Math.max(raw,product.moq)/product.carton)*product.carton : 0;
    let running = available, firstGap = null;
    for (let day=1;day<=lead;day++) {
      // 到货按该日开始计入，随后扣除当天需求；预测不计尚未下单的采购。
      running += arrivals.filter(x=>x.days_until_arrival===day).reduce((s,x)=>s+x.quantity,0);
      running -= daily;
      if (running < -1e-9 && firstGap === null) firstGap = day;
    }
    const late = arrivals.some(x=>x.days_until_arrival>lead+product.safety_days+product.review_days);
    Object.assign(out, {daily_demand:round(daily), lead_days:lead, available,
      confirmed_inbound:confirmed, target_stock:target, inventory_position:position,
      raw_quantity:raw, order_quantity:quantity, first_gap_day:firstGap,
      coverage_days:round(available/daily), late_inbound:late,
      decision:quantity>0?'生成采购草稿':'暂不新增采购',
      reason: quantity>0?'按目标库存、MOQ及箱规计算':'已确认库存位置覆盖目标，避免重复下单'});
    if (firstGap !== null) out.reason += `；第${firstGap}天预计出现缺口，需催货或调拨`;
    if (late) out.reason += '；存在晚到在途，先核实或催货，不能当作当前可售库存';
    return out;
  }
  function adRecommendation(r, campaign) {
    let action='建议维持', reason='到新采购提前期内未预测到库存缺口';
    if (r.order_quantity === null) {action='人工检查';reason=r.reason;}
    else if (!campaign || campaign.skus.length !== 1) {action='人工检查';reason='广告缺失或覆盖多个SKU，需要运营确认操作范围';}
    else if (r.first_gap_day !== null && r.coverage_days <= 7) {
      action='建议暂停';reason=`当前库存覆盖${r.coverage_days}天，第${r.first_gap_day}天预计缺货`;
    } else if (r.first_gap_day !== null) {
      action='建议降低预算';reason=`第${r.first_gap_day}天预计缺货，建议运营评估控制投放`;
    }
    return {sku:r.sku, warehouse:r.warehouse, campaign_id:campaign?campaign.id:'',
      platform:campaign?campaign.platform:'', action, reason, executed:false,
      status:'待运营审批（模拟）', recommendation_only:true};
  }
  function verifyShipment(expected, extracted, knownSkus) {
    const issues=[];
    if (!extracted.sku) issues.push('SKU无法读取');
    else if (!knownSkus.includes(extracted.sku)) issues.push('SKU未建档');
    else if (extracted.sku !== expected.sku) issues.push('SKU与订单不符');
    if (extracted.quantity === null) issues.push('标签数量无法读取');
    else if (extracted.quantity !== expected.quantity) issues.push('标签数量与订单不符');
    if (!extracted.tracking) issues.push('物流单号缺失');
    else if (extracted.tracking !== expected.tracking) issues.push('物流单号与发货记录不符');
    return {shipment_id:expected.shipment_id, order_id:expected.order_id,
      expected_sku:expected.sku, extracted_sku:extracted.sku,
      expected_quantity:expected.quantity, extracted_quantity:extracted.quantity,
      tracking:extracted.tracking, status:issues.length?'异常待核对':'字段匹配，待人工核对',
      issues, confirmed:false, quantity_source:'标签文字，不代表实际内件数量'};
  }
  function runAll(data) {
    const sync=syncOrders(data.order_events);
    const replenishments=data.products.map(p=>replenishment(p,
      data.inventory.find(s=>s.sku===p.sku && s.warehouse===p.warehouse),data.inbound,data.as_of));
    const ads=replenishments.map(r=>adRecommendation(r,data.campaigns.find(c=>c.skus.includes(r.sku))));
    const shipments=data.shipments.map(s=>verifyShipment(s,s.extracted,data.products.map(p=>p.sku)));
    const purchases=replenishments.filter(r=>r.order_quantity>0).map(r=>({
      draft_id:`DEMO-PO-${r.sku}-${r.warehouse}`, sku:r.sku, warehouse:r.warehouse,
      quantity:r.order_quantity, status:'待采购审批（模拟）', submitted:false, executed:false}));
    return {orders:Object.values(sync.state), sync:{created:sync.created,updated:sync.updated,
      ignored:sync.ignored,total:sync.total}, shipments, replenishments, purchases, ads};
  }
  const api={syncOrders,replenishment,adRecommendation,verifyShipment,runAll};
  if(typeof module!=='undefined'&&module.exports) module.exports=api;
  else root.DemoEngine=api;
})(typeof globalThis!=='undefined'?globalThis:this);
</script>

const ORIGINAL_SCENARIO=JSON.parse(JSON.stringify({inventory:DATA.inventory,order_events:DATA.order_events}));
const STORE='auto-parts-interactive-v2';
let result=null,orderState={},confirmations={},approvals={},adReviews={},logs=[],active='start';
const $=id=>document.getElementById(id);
const esc=x=>String(x??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function persist(){try{localStorage.setItem(STORE,JSON.stringify({result,orderState,confirmations,approvals,adReviews,logs,scenario:{inventory:DATA.inventory,order_events:DATA.order_events}}));}catch(e){$('status').textContent='浏览器禁止本地保存；当前会话仍可操作，关闭后会清空。';}}
function log(msg){logs.unshift(`${new Date().toLocaleTimeString('zh-CN',{timeZone:'Asia/Shanghai'})} ${msg}`);logs=logs.slice(0,30);$('log').innerHTML=logs.map(esc).join('<br>');}
function refreshStats(){
  $('count-orders').textContent=result?result.orders.length:0;
  $('count-issues').textContent=result?result.shipments.filter(s=>s.issues.length&&!confirmations[s.shipment_id]).length:0;
  $('count-purchases').textContent=result?result.purchases.length:0;
  $('count-ads').textContent=result?result.ads.filter(a=>a.action==='建议暂停').length:0;

function needRun(){return !result?'<p>请先点击上方“一键运行模拟流程”。</p>':null;}
function render(){
  document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===active));
  let html='';
  if(active==='start')html=`<h2>按四步体验业务流程</h2><p>你无需安装程序或填写密钥。数据固定在模拟日期，不受今天的日期影响。</p><div class="steps"><div><b>1. 运行</b>点击一键运行；再点一次同步，检查订单没有增加。</div><div><b>2. 核对</b>打开“发货核对”，比对标签和订单；纠正模拟异常后保存。</div><div><b>3. 审批</b>打开补货计算查看依据，在采购审批中批准一份模拟草稿。</div><div><b>4. 评估</b>查看广告建议，标记运营已评估。不会真实关广告。</div></div><div class="formula"><b>示例公式</b><br>日需求 = max(近7天销量÷7，近30天销量÷30)<br>目标库存 = 向上取整(日需求 × [采购+运输+上架+安全+复查天数])<br>库存位置 = 在库−占用+全部已确认未到货采购<br>原始补货 = max(0，目标库存−库存位置)<br>有补货需求时，按最小起订量和整箱要求向上取整。</div><p class="muted">在途数量用于避免重复采购；逐日预测另行判断晚到货是否能解决缺货。新品、过期库存和多SKU广告进入人工检查。正式业务需再加入利润、广告效率和销量断货修正。</p>`;

  else if(needRun())html=needRun();
  else if(active==='orders')html='<h2>订单同步</h2><p class="muted">初始33个输入事件合并为30条订单。可用上方按钮变更DEMO-ORD-006，再重放检查不重复。库存采用独立快照，不因订单显示更新再扣一遍。</p>'+table(['订单','平台','SKU','数量','状态','版本'],result.orders.map(o=>[esc(o.order_id),esc(o.channel),esc(o.sku),o.quantity,tag(o.status,o.status==='shipped'?'good':''),o.revision]));
  else if(active==='shipments')html='<h2>发货核对</h2><p class="muted">标签已通过本地 Tesseract OCR；此处展示读取结果。异常案例在实际业务需先纠正货物/标签，再确认。输入框用于模拟纠正，原始识别结果保留在导出文件。</p><div class="cards">'+DATA.shipments.map((s,i)=>{const r=result.shipments[i],c=confirmations[s.shipment_id];return `<article class="shipment"><b>${esc(s.shipment_id)} · ${esc(s.scenario)}</b><br>${tag(c?'人工已确认（模拟）':r.status,c?'good':r.issues.length?'bad':'warn')}<p class="muted">订单应为：${esc(s.sku)} / ${s.quantity}件 / ${esc(s.tracking)}</p><img alt="${esc(s.shipment_id)}虚构发货标签" src="${s.label_image}"><p class="muted">OCR初始结果：${esc(r.extracted_sku)} / ${esc(r.extracted_quantity)}件 / ${esc(r.tracking)}<br>异常：${esc(r.issues.join('；')||'字段匹配，仍需人工核实实际货物')}</p><div class="fieldgrid"><label>人工核对SKU<input id="sku-${i}" value="${esc(c?c.sku:s.extracted.sku||'')}"></label><label>确认件数<input id="qty-${i}" type="number" min="1" step="1" value="${esc(c?c.quantity:s.extracted.quantity??'')}"></label><label>确认物流单号<input id="tracking-${i}" value="${esc(c?c.tracking:s.extracted.tracking||'')}"></label></div><button data-confirm="${i}">保存人工核对（模拟）</button><details><summary>查看原始OCR文本字段</summary><pre>${esc(JSON.stringify(s.extracted,null,2))}</pre></details></article>`;}).join('')+'</div>';
  else if(active==='replenishment')html='<h2>补货计算依据</h2><p class="muted">数量单位均为件；采购量为“—”表示未自动计算，需要人工检查。预计缺口按未来每天日初到货、随后扣需求计算。</p>'+table(['SKU','日需求','提前期','可售','确认在途','目标','库存位置','采购量','首个缺口日','理由'],result.replenishments.map(r=>[esc(r.sku),esc(r.daily_demand),esc(r.lead_days),esc(r.available),esc(r.confirmed_inbound),esc(r.target_stock),esc(r.inventory_position),r.order_quantity===null?tag('人工检查','warn'):r.order_quantity,esc(r.first_gap_day),esc(r.reason)]));
  else if(active==='purchases')html='<h2>采购草稿审批</h2><p class="muted">批准仅保存浏览器模拟审批。不会创建通途采购单，不增加库存，也不会自动消除预计缺口。</p>'+table(['草稿编号','SKU','仓库','采购件数','状态','操作'],result.purchases.map((p,i)=>[esc(p.draft_id),esc(p.sku),esc(p.warehouse),p.quantity,tag(approvals[p.draft_id]?'模拟已批准，未提交':'待采购审批',approvals[p.draft_id]?'good':'warn'),`<button data-approve="${i}" ${approvals[p.draft_id]?'disabled':''}>模拟批准</button>`]));
  else if(active==='ads')html='<h2>广告调整建议</h2><p class="muted">这里按库存规则提出建议，尚未纳入真实利润、ROAS或广告接口。标记评估不会改变广告状态。</p>'+table(['SKU','广告对象','平台','建议','依据','执行状态','操作'],result.ads.map((a,i)=>[esc(a.sku),esc(a.campaign_id),esc(a.platform),tag(a.action,a.action==='建议暂停'?'bad':a.action==='人工检查'?'warn':'good'),esc(a.reason),tag('未执行'),`<button data-ad="${i}" ${adReviews[a.sku]?'disabled':''}>${adReviews[a.sku]?'已模拟评估':'标记已评估'}</button>`]));

  if(active==='shipments'&&result)html+='<h2>A/B/C实物计数：在飞书运行AI测试</h2><p class="muted">下面是AI生成的测试图片，仅用于展示与下载。此离线页不识别新图，也没有真实模型输出；折叠项是人工目视标注的测试期望。请按操作清单在飞书逐张生成结果。</p><div class="cards">'+[
    ['A','photo-count-test/A-two-visible.png','2个完整可见滤芯；标签QTY2。','完整可见数量2；总数可确定；与标签一致。'],
    ['B','photo-count-test/B-one-visible-label-two.png','1个完整可见滤芯；标签仍写QTY2。','完整可见数量1；总数可确定；与标签不一致。'],
    ['C','photo-count-test/C-occluded.png','1个完整可见滤芯；右侧局部被遮挡。','完整可见数量1；总数无法确定；与标签无法判断。']
  ].map(([name,path,caption,expected])=>`<article class="shipment"><b>测试图${name}</b><p>${esc(caption)}</p><img alt="合成实物计数测试图${name}" src="${path}"><p><a href="${path}" download>下载测试图${name}</a></p><details><summary>测试期望（不是AI实际输出）</summary><p>${esc(expected)}</p></details></article>`).join('')+'</div>';
  $('panel').innerHTML=html;
}

$('stock-sku').innerHTML=DATA.products.map(p=>`<option value="${esc(p.sku)}">${esc(p.sku)}</option>`).join('');
$('stock-sku').value='AF-RU-001';
function showStockInput(){const stock=DATA.inventory.find(x=>x.sku===$('stock-sku').value);$('stock-value').value=stock.on_hand;}
$('stock-sku').onchange=showStockInput;
$('order-change').onclick=()=>{
 if(!result)run();
 const old=Object.values(orderState).find(o=>o.order_id==='DEMO-ORD-006');
 const event={...old,status:old.status==='cancelled'?'awaiting_shipment':'cancelled',revision:old.revision+1,updated_at:new Date(Date.parse(DATA.as_of)+(old.revision+1)*1000).toISOString()};
 DATA.order_events.push(event);
 const sync=DemoEngine.syncOrders([event],orderState);result.orders=Object.values(orderState);
 $('status').textContent=`模拟订单变更：DEMO-ORD-006 → ${event.status}；新增${sync.created}，更新${sync.updated}，总数${sync.total}。`;
 log($('status').textContent);active='orders';persist();refreshStats();render();
};
$('stock-apply').onclick=()=>{
 const raw=$('stock-value').value.trim();const quantity=Number(raw);
 const stock=DATA.inventory.find(x=>x.sku===$('stock-sku').value);
 if(!raw||!Number.isInteger(quantity)||quantity<stock.reserved){$('status').textContent='库存修改未应用：请输入整数，且不能小于已占用数量。';return;}
 stock.on_hand=quantity;stock.updated_at=DATA.as_of;
 approvals={};adReviews={};run();
 $('status').textContent=`已修改模拟库存 ${stock.sku}=${quantity}件，并重算补货、采购草稿与广告建议。旧模拟审批已清空，需重新核对。`;
 log($('status').textContent);active='replenishment';persist();refreshStats();render();
};
$('run').onclick=run;
$('sync').onclick=()=>{if(!result){run();return;}const s=DemoEngine.syncOrders(DATA.order_events,orderState);result.orders=Object.values(orderState);$('status').textContent=`再次同步：新增${s.created}，更新${s.updated}，忽略${s.ignored}，总数${s.total}。`;log($('status').textContent);persist();refreshStats();render();};
$('reset').onclick=()=>{DATA.inventory=JSON.parse(JSON.stringify(ORIGINAL_SCENARIO.inventory));DATA.order_events=JSON.parse(JSON.stringify(ORIGINAL_SCENARIO.order_events));$('stock-sku').value='AF-RU-001';$('stock-value').value=30;result=null;orderState={};confirmations={};approvals={};adReviews={};logs=[];active='start';try{localStorage.removeItem(STORE);}catch(e){}$('status').textContent='已重置。请重新运行模拟。';$('log').textContent='';refreshStats();render();};
$('export').onclick=()=>{if(!result){$('status').textContent='请先运行模拟。';return;}const snapshot={mode:'simulation',as_of:DATA.as_of,results:result,manual_confirmations:confirmations,simulated_approvals:approvals,ad_reviews:adReviews,logs};const url=URL.createObjectURL(new Blob([JSON.stringify({...snapshot,scenario:{inventory:DATA.inventory,order_events:DATA.order_events}},null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='汽配Agent当前模拟结果.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{active=b.dataset.tab;render();});
$('panel').onclick=e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.dataset.confirm!==undefined){const i=Number(b.dataset.confirm),s=DATA.shipments[i];
  const entered={sku:$(`sku-${i}`).value.trim().toUpperCase(),quantity:Number($(`qty-${i}`).value),tracking:$(`tracking-${i}`).value.trim().toUpperCase()};
  const check=DemoEngine.verifyShipment(s,entered,DATA.products.map(p=>p.sku));
  if(check.issues.length){$('status').textContent='无法确认：'+check.issues.join('；');return;}
  confirmations[s.shipment_id]={...entered,status:'人工已确认（模拟）'};log(`模拟人工核对 ${s.shipment_id}，原始OCR结果保留。`);
 }
 if(b.dataset.approve!==undefined){const p=result.purchases[Number(b.dataset.approve)];approvals[p.draft_id]={status:'模拟已批准',submitted:false};log(`批准模拟草稿 ${p.draft_id}；未提交通途。`);}
 if(b.dataset.ad!==undefined){const a=result.ads[Number(b.dataset.ad)];adReviews[a.sku]={reviewed:true,executed:false};log(`运营模拟评估 ${a.sku}：${a.action}；未执行。`);}
 persist();refreshStats();render();
};
try{const saved=JSON.parse(localStorage.getItem(STORE)||'null');if(saved&&saved.result){({result,orderState,confirmations,approvals,adReviews,logs}=saved);if(saved.scenario){DATA.inventory=saved.scenario.inventory;DATA.order_events=saved.scenario.order_events;}$('status').textContent='已恢复当前浏览器的模拟操作。';$('log').innerHTML=logs.map(esc).join('<br>');}}catch(e){}
showStockInput();refreshStats();render();
</script></body></html>
